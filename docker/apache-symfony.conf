ServerName localhost

<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    # Toutes les URL qui ne correspondent pas à un fichier passent par le contrôleur frontal Symfony.
    FallbackResource /index.php
</Directory>

# Les assets compilés portent un hash dans leur nom : cache longue durée.
<Directory /var/www/html/public/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# Ne rien exposer des fichiers cachés (.env, .git...).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
